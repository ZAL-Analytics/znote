[package]
name = "znote"

version = "0.2.1"
description = "A lightweight desktop editor for Typst with live preview, built with Tauri"
license = "Apache-2.0"
repository = "https://github.com/ZAL-Analytics/znote"
readme = "../README.md"
keywords = ["typst", "editor", "tauri"]
categories = ["text-editors"]
edition = "2024"
# dist/ is the gitignored frontend build; listing it here ships it in the crate so `cargo install` works
include = ["src/**", "build.rs", "tauri.conf.json", "capabilities/**", "icons/**", "dist/**"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "znote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
trash = "5"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-packages", "system-downloader", "datetime"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-svg = "0.15.1"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[[test]]
name = "versions"
path = "../test/versions.rs"
